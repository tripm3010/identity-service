spring:
    application:
        name: identity-service
    datasource:
        username: root
        password: root
        url: "jdbc:mysql://localhost:3306/identity_service"
    jpa:
        hibernate:
              ddl-auto: update
        show-sql: true
    devtools:
        livereload:
            enabled: true
        restart:
            enabled: true


server:
    port: 8080
    servlet:
        context-path: /identity

